name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  hygiene:
    name: Module hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: No external dependencies
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "unexpected dependencies:"; echo "$deps"; exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum 2>/dev/null; then
            echo "go.mod/go.sum not tidy"; exit 1
          fi
